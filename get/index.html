<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Get BookNStyle</title>
<meta name="description" content="Get the BookNStyle app on the App Store or Google Play.">
<meta name="robots" content="noindex">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self'; font-src 'self'; form-action 'none'; base-uri 'none'">
<meta name="theme-color" content="#0A0B11">
<meta name="color-scheme" content="dark">
<link rel="icon" href="/img/mark.png">
<noscript><meta http-equiv="refresh" content="0;url=/join/"></noscript>
<!--
  https://app.booknstyle.com/get : the smart link printed as the QR code on
  the pro postcards (Oct 2026). One code for every phone:
    iPhone or iPad   -> the App Store page
    Android          -> the Google Play page
    anything else    -> /join/ (what pros get, with both store buttons)
  Until launch day STORE_LINKS is empty, so everyone lands on /join/, which
  says "Coming soon". Fill both links on launch day together with
  web/site/main.js and join/index.html (RUNBOOK step 8). The printed URL
  never changes, so postcards printed before launch keep working.

  Rules for this page: no prices, no competitor names, no full-screen
  spinner (owner). Must not link to the billing page
  (scripts/billing-guard.mjs).

  The look: the website's (booknstyle.com), the same as /assets/editorial.css
  and the booking page, but written out here instead of linked: a linked
  stylesheet would make the redirect below wait for it to download. Only
  the fonts come from this site (/assets/webfonts/), and fonts never hold
  up a script. The buttons are styled by position, so the script stays as
  it is: the first link is the gold one (today: See what pros get), the
  rest are outlined.
-->
<style>
  @font-face { font-family: "Bodoni Moda"; font-style: normal; font-weight: 400 500; font-display: swap;
    src: url("/assets/webfonts/bodoni-moda-latin.woff2") format("woff2"); }
  @font-face { font-family: "Bodoni Moda"; font-style: italic; font-weight: 400 500; font-display: swap;
    src: url("/assets/webfonts/bodoni-moda-italic-latin.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-style: normal; font-weight: 400 600; font-display: swap;
    src: url("/assets/webfonts/inter-latin.woff2") format("woff2"); }
  :root {
    --ink-0: #0A0B11; --text: #F5F4EE; --text-2: rgba(245, 244, 238, .76);
    --champ: #C8956A; --champ-l: #DFB990; --ink-text: #16182B; --line: rgba(223, 185, 144, .24);
    --grad-gold: linear-gradient(135deg, #EACBA5 0%, #D7A97E 38%, #C8956A 62%, #B5825A 100%);
    --grad-gold-text: linear-gradient(100deg, #F0D3AE 0%, #DFB990 35%, #C8956A 70%, #E7C59D 100%);
    --serif: "Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
    --sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --ease-out: cubic-bezier(.16, 1, .3, 1);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  html, body { margin: 0; }
  h1, p { margin: 0; }
  body {
    min-height: 100vh; min-height: 100dvh; position: relative; overflow-x: hidden;
    background: var(--ink-0); color: var(--text);
    font: 16px/1.6 var(--sans); -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  }
  body::before {
    content: ""; position: fixed; inset: -20% -40% auto; height: 80vh; pointer-events: none;
    background: radial-gradient(closest-side, rgba(200, 149, 106, .16), rgba(200, 149, 106, 0));
  }
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .06; mix-blend-mode: overlay;
    background-image: url("/assets/grain.svg");
  }
  :focus-visible { outline: 2px solid var(--champ-l); outline-offset: 3px; border-radius: 6px; }
  .top { position: relative; z-index: 1; padding: calc(34px + env(safe-area-inset-top, 0px)) 16px 0; text-align: center; }
  .brand { display: inline-flex; flex-direction: column; align-items: center; }
  .brand img { width: 50px; height: auto; filter: drop-shadow(0 5px 10px rgba(0, 0, 0, .5)); }
  .brand span { margin-top: 12px; font-size: 12px; font-weight: 600; letter-spacing: .42em; margin-right: -.42em; }
  .brand i { display: block; width: 72px; height: 1px; margin-top: 12px; background: linear-gradient(90deg, rgba(200,149,106,0), var(--champ), rgba(200,149,106,0)); }
  main { position: relative; z-index: 1; max-width: 440px; margin: 30px auto 0; padding: 0 16px calc(40px + env(safe-area-inset-bottom, 0px)); }
  .card {
    background: linear-gradient(180deg, rgba(29, 32, 56, .9), rgba(22, 24, 43, .96));
    border: 1px solid var(--line); border-radius: 28px; text-align: center;
    padding: 36px 24px 30px; box-shadow: 0 40px 80px -30px rgba(0, 0, 0, .7);
  }
  h1 {
    font-family: var(--serif); font-weight: 400; font-size: 36px; line-height: 1.08;
    letter-spacing: -.02em; text-wrap: balance;
  }
  h1 em {
    font-style: italic; background: var(--grad-gold-text); -webkit-background-clip: text; background-clip: text;
    color: transparent; padding-right: .06em;
  }
  .sub { color: var(--text-2); margin: 14px auto 0; font-size: 16px; text-wrap: pretty; }
  .links { display: grid; gap: 12px; margin-top: 28px; }
  /* The website's buttons, for the links the script adds: the first one gold, the rest outlined */
  .links a {
    display: flex; align-items: center; justify-content: center; width: 100%;
    min-height: 56px; padding: 14px 24px; border-radius: 999px; text-decoration: none; text-align: center;
    font: 600 16px/1.3 var(--sans); letter-spacing: .01em;
    background: rgba(245, 244, 238, .02); color: var(--text); box-shadow: inset 0 0 0 1px var(--line);
    transition: transform .5s var(--ease-out), box-shadow .5s var(--ease-out), background-color .3s;
  }
  .links a:hover { box-shadow: inset 0 0 0 1px var(--champ-l); background: rgba(200, 149, 106, .06); transform: translateY(-2px); }
  .links a:first-child {
    background: var(--grad-gold); color: var(--ink-text);
    box-shadow: 0 10px 30px -12px rgba(200, 149, 106, .65), inset 0 1px 0 rgba(255, 255, 255, .35);
  }
  .links a:first-child:hover { box-shadow: 0 18px 40px -14px rgba(200, 149, 106, .8), inset 0 1px 0 rgba(255, 255, 255, .4); }
  .links a:focus-visible { outline-offset: 4px; border-radius: 999px; }
  @media (min-width: 560px) {
    main { margin-top: 40px; }
    .card { padding: 44px 40px 36px; }
    h1 { font-size: 42px; }
  }
  @media (prefers-reduced-motion: reduce) { .links a { transition: none; } .links a:hover { transform: none; } }
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <img src="/img/mark.png" alt="">
    <span>BOOKNSTYLE</span>
    <i></i>
  </div>
</header>
<main>
  <section class="card center">
    <h1 id="title">Taking you to <em>BookNStyle</em></h1>
    <p class="sub" id="note">If nothing happens, pick your store below.</p>
    <div class="links" id="links">
      <a id="join" href="/join/">See what pros get with BookNStyle</a>
    </div>
  </section>
</main>
<script>
(function () {
  'use strict';

  // STORE LINKS: empty until the apps are live; fill both on launch day
  // (RUNBOOK step 8), for example
  //   appStore:   'https://apps.apple.com/us/app/booknstyle/id6813224710'
  //   googlePlay: 'https://play.google.com/store/apps/details?id=com.booknstyle.app'
  var STORE_LINKS = {
    appStore: '',
    googlePlay: ''
  };
  var JOIN = '/join/';

  function link(key) {
    var url = String(STORE_LINKS[key] || '').trim();
    return /^https:\/\//i.test(url) ? url : '';
  }

  var ua = navigator.userAgent || '';
  // iPadOS 13 and later says "Macintosh"; a touch screen tells it apart.
  var isIOS = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1);
  var isAndroid = /Android/i.test(ua);

  var appStore = link('appStore');
  var googlePlay = link('googlePlay');

  // Manual choices, in case a browser blocks the automatic redirect.
  var box = document.getElementById('links');
  function addLink(href, text) {
    var a = document.createElement('a');
    a.href = href;
    a.rel = 'noopener';
    a.textContent = text;
    box.insertBefore(a, document.getElementById('join'));
  }
  if (googlePlay && isAndroid) addLink(googlePlay, 'Get it on Google Play');
  if (appStore) addLink(appStore, 'Download on the App Store');
  if (googlePlay && !isAndroid) addLink(googlePlay, 'Get it on Google Play');

  var target = JOIN;
  if (isIOS && appStore) target = appStore;
  else if (isAndroid && googlePlay) target = googlePlay;

  location.replace(target);
})();
</script>
</body>
</html>
