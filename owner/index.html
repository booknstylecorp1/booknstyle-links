<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>BookNStyle owner action</title>
<meta name="robots" content="noindex, nofollow">
<!-- The signed link is in the address bar: never send it to another site. -->
<meta name="referrer" content="no-referrer">
<!--
  Nothing from any other host except the one call to BookNStyle's Supabase
  project. The script is inline (this page is one self-contained file), and
  it only ever writes text (textContent), never markup, so nothing on the
  page can be turned into code.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self'; connect-src https://ebrxekhmlxlccuvcwiwb.supabase.co; form-action 'none'; base-uri 'none'">
<meta name="theme-color" content="#1A1F36">
<link rel="icon" href="/img/mark.png">
<!--
  https://app.booknstyle.com/owner/ : the confirm page for the one-click
  links in the owner's emails (the weekly dispute report, dispute alerts and
  the "Pro didn't show" report). Only the owner gets these emails.

  WHY it exists: the links point at the owner-action edge function
  (supabase/functions/owner-action). On Supabase's default *.supabase.co
  address a function can't show a web page to a GET (Supabase turns the page
  into plain text), so with OWNER_ACTION_PAGE_URL set to this page's address
  the function sends every link here instead:
    ?a=<action>&t=<target>&e=<expiry>&s=<signature>  a link it checked
    ?invalid=1                                         an expired or forged one
  This page says what the link will do and shows one button. Nothing happens
  until the button is pressed, so email scanners that open every link can't
  act on it.

  The button POSTs a, t, e and s (form-urlencoded, Accept: application/json)
  to the function, which checks the signature again, acts, and answers
  { ok, title, message, lines }; the page shows that answer. Every action can
  be repeated safely, so "Try again" after a failure never does anything
  twice. The function allows this site's origin to read its answer (CORS).

  The signature is the only permission (nobody signs in here), so treat the
  emails as private. The page sends no Referer, loads nothing from other
  sites, and keeps no copy of the link.

  Actions (the same list as supabase/functions/_shared/ownerActions.ts; add a
  new one there, in owner-action, and in ACTIONS below):
    lift_restriction  every booking restriction on the client's account
    lift_pause        let a client book while their payment dispute is open
    unban_card        a card banned after a fraud dispute
    no_show_release   "Pro didn't show" report: the pro was there
    no_show_refund    "Pro didn't show" report: cancel and refund

  Not linked from anywhere on this site, and not in .well-known/, so it
  always opens in the browser, never in the app. Like every page on this
  site except /pro/, it must not link to the billing page
  (scripts/billing-guard.mjs).
-->
<style>
  :root {
    --bg: #FAFAF7; --surface: #FFFFFF; --muted-bg: #F4F1EA;
    --ink: #1A1F36; --ink-soft: #3D4258; --muted: #6B6B7B; --muted-light: #A8A8B3;
    --accent: #C8956A; --accent-soft: #F1E5D6;
    --border: #EFEAE0; --hero: #1A1F36; --on-hero: #FFFFFF;
    --button: #1A1F36; --on-button: #FFFFFF;
    --ok: #2F6B45; --bad: #B3261E;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0E1018; --surface: #181B26; --muted-bg: #222530;
      --ink: #F5F4EE; --ink-soft: #C7C6BD; --muted: #8E8F95; --muted-light: #5C5D66;
      --accent-soft: #3A2E22; --border: #262936; --hero: #0A0B11; --on-hero: #F5F4EE;
      --button: #C8956A; --on-button: #13141B;
      --ok: #9BC4A8; --bad: #E5867A;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .hero {
    background: var(--hero); color: var(--on-hero);
    padding: calc(22px + env(safe-area-inset-top, 0px)) 20px 88px;
    text-align: center;
  }
  .brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; }
  .brand img { width: 28px; height: auto; }
  .brand span { font-size: 13px; font-weight: 700; letter-spacing: 3px; text-transform: uppercase; }
  main { max-width: 480px; margin: -64px auto 0; padding: 0 16px calc(40px + env(safe-area-inset-bottom, 0px)); }
  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
    padding: 28px 22px; box-shadow: 0 10px 30px rgba(26, 31, 54, 0.08);
  }
  .eyebrow {
    font-size: 12px; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase;
    color: var(--accent); margin: 0 0 14px;
  }
  .eyebrow.ok { color: var(--ok); }
  .eyebrow.bad { color: var(--bad); }
  h1 { font-size: 24px; line-height: 1.25; letter-spacing: -0.3px; margin: 0; }
  .lines { margin: 14px 0 0; }
  .lines p { margin: 0 0 10px; color: var(--ink-soft); overflow-wrap: anywhere; }
  .lines p:last-child { margin-bottom: 0; }
  .go {
    display: block; width: 100%; margin: 24px 0 0; padding: 14px 20px; border: 0; border-radius: 12px;
    background: var(--button); color: var(--on-button); font: inherit; font-weight: 700; font-size: 16px;
    cursor: pointer; appearance: none; -webkit-appearance: none;
  }
  .go:disabled { opacity: 0.6; cursor: default; }
  .fine { margin: 18px 0 0; padding-top: 14px; border-top: 1px solid var(--border); color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
  .fine p { margin: 0 0 4px; }
  footer { text-align: center; color: var(--muted-light); font-size: 12px; margin-top: 24px; }
  footer a { color: inherit; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <header class="hero">
    <a class="brand" href="/">
      <img src="/img/mark.png" alt="">
      <span>BookNStyle</span>
    </a>
  </header>

  <main>
    <section class="card" aria-live="polite">
      <p class="eyebrow" id="eyebrow">Owner action</p>
      <h1 id="title">Open this link from the BookNStyle email</h1>
      <div class="lines" id="lines">
        <p>This page needs JavaScript to work. If you opened the link from an email, try it again in your phone's or computer's web browser.</p>
      </div>
      <button class="go" id="go" type="button" hidden></button>
      <div class="fine" id="fine" hidden></div>
    </section>

    <footer>
      <a href="https://legal.booknstyle.com/terms/">Terms</a> ·
      <a href="https://legal.booknstyle.com/privacy/">Privacy</a> ·
      © BookNStyle LLC
    </footer>
  </main>

<script>
(function () {
  'use strict';

  var FUNCTION_URL = 'https://ebrxekhmlxlccuvcwiwb.supabase.co/functions/v1/owner-action';

  // What each link does, before the owner presses the button. The details
  // (which client, which booking) are in the email the link came from; the
  // function's answer after the button says exactly what changed.
  var ACTIONS = {
    lift_restriction: {
      eyebrow: 'Booking restriction',
      title: 'Lift the booking restriction?',
      lines: [
        'The client can make new bookings again. Every booking restriction on their account is lifted.',
        'If they still have a payment dispute open, they stay paused until the bank decides. That pause has its own link in the weekly report.',
        'Card bans are separate and stay.'
      ],
      button: 'Lift the restriction'
    },
    lift_pause: {
      eyebrow: 'Payment dispute',
      title: 'Let this client book again while their dispute is open?',
      lines: [
        'They can make new bookings while this dispute is still open.',
        'Card bans and other limits still apply, and a new dispute pauses them again.'
      ],
      button: 'Let them book again'
    },
    unban_card: {
      eyebrow: 'Banned card',
      title: 'Unban this card?',
      lines: [
        "Anyone can book with this card again. If it is on Stripe Radar's block list, it comes off that too.",
        "The client's own booking restriction is separate. It has its own link."
      ],
      button: 'Unban the card'
    },
    no_show_release: {
      eyebrow: "Pro didn't show report",
      title: 'Pro was there: release the payment?',
      lines: [
        "The pause ends. The client's card is charged at the next automatic run (every 15 minutes) once the appointment has been over for an hour, or sooner if the pro taps Mark complete.",
        'If the card is declined, the client is asked to update it, like any booking, and BookNStyle keeps trying for up to a week.',
        'The pro is told when the card will be charged.'
      ],
      button: 'Release the payment'
    },
    no_show_refund: {
      eyebrow: "Pro didn't show report",
      title: "Pro didn't show: cancel and refund?",
      lines: [
        "The booking is cancelled as a pro cancellation. The hold on the client's card is released, or the service payment is refunded if it was already charged.",
        'The client gets their booking fee back as a credit for their next booking, and is told their pro cancelled.',
        'If the late-cancellation charge for pros is switched on, the pro is charged it too.'
      ],
      button: 'Cancel and refund'
    }
  };

  var LINK_HELP = 'Links in BookNStyle emails work for 14 days. For an older one, use the newest email, or make the change in the database.';

  function $(id) { return document.getElementById(id); }

  // Text only: every value goes in with textContent, never as markup.
  function setLines(lines) {
    var box = $('lines');
    while (box.firstChild) box.removeChild(box.firstChild);
    for (var i = 0; i < lines.length; i++) {
      var p = document.createElement('p');
      p.textContent = String(lines[i]);
      box.appendChild(p);
    }
    box.hidden = lines.length === 0;
  }

  // tone: '' (asking), 'ok' (done) or 'bad' (not done).
  function show(eyebrow, title, lines, tone) {
    var e = $('eyebrow');
    e.textContent = eyebrow;
    e.className = 'eyebrow' + (tone ? ' ' + tone : '');
    $('title').textContent = title;
    document.title = 'BookNStyle: ' + title;
    setLines(lines);
  }

  function setFine(lines) {
    var box = $('fine');
    while (box.firstChild) box.removeChild(box.firstChild);
    for (var i = 0; i < lines.length; i++) {
      var p = document.createElement('p');
      p.textContent = lines[i];
      box.appendChild(p);
    }
    box.hidden = lines.length === 0;
  }

  function stop(title, lines) {
    show('Link problem', title, lines, 'bad');
    $('go').hidden = true;
    setFine([]);
  }

  var q = new URLSearchParams(location.search);
  if (q.get('invalid')) {
    stop("This link has expired or isn't valid.", [LINK_HELP]);
    return;
  }

  var a = q.get('a') || '';
  var t = q.get('t') || '';
  var e = q.get('e') || '';
  var s = q.get('s') || '';
  var action = Object.prototype.hasOwnProperty.call(ACTIONS, a) ? ACTIONS[a] : null;
  if (!action || !t || !s || !/^\d{1,12}$/.test(e)) {
    stop("This link isn't complete", [
      'Open it again from the email. If your email app cut it short, copy the whole link into your browser.'
    ]);
    return;
  }

  var expiresAt = new Date(Number(e) * 1000);
  if (expiresAt.getTime() <= Date.now()) {
    stop('This link has expired', [LINK_HELP]);
    return;
  }

  show(action.eyebrow, action.title, action.lines, '');
  var whenText;
  try {
    whenText = expiresAt.toLocaleString('en-US', {
      weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', timeZoneName: 'short'
    });
  } catch (err) {
    whenText = expiresAt.toString();
  }
  setFine([
    'The details are in the email this link came from.',
    'This link works until ' + whenText + '.',
    'Reference: ' + t
  ]);

  var button = $('go');
  var busy = false;
  button.textContent = action.button;
  button.hidden = false;

  // After an answer that can be tried again (busy, or a hiccup on the way),
  // the button comes back. Every action is safe to repeat.
  function offerRetry() {
    busy = false;
    button.disabled = false;
    button.textContent = 'Try again';
    button.hidden = false;
  }

  button.onclick = function () {
    if (busy) return;
    busy = true;
    button.disabled = true;
    button.textContent = 'Working...';

    var body = new URLSearchParams();
    body.set('a', a);
    body.set('t', t);
    body.set('e', e);
    body.set('s', s);

    fetch(FUNCTION_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded', 'Accept': 'application/json' },
      body: body.toString(),
      credentials: 'omit',
      cache: 'no-store',
      referrerPolicy: 'no-referrer'
    })
      .then(function (res) {
        return res.json().then(
          function (json) { return { status: res.status, json: json }; },
          function () { return { status: res.status, json: null }; }
        );
      })
      .then(function (r) {
        var json = r.json && typeof r.json === 'object' ? r.json : {};
        var title = typeof json.title === 'string' && json.title ? json.title : '';
        // The answer's own lines (none is fine: then the title says it all).
        var lines = Array.isArray(json.lines)
          ? json.lines
          : (typeof json.message === 'string' && json.message && json.message !== title ? [json.message] : []);

        if (json.ok === true) {
          show('Done', title || 'Done', lines, 'ok');
          button.hidden = true;
          return;
        }
        // Busy, or a hiccup on the server's side or on the way: worth another
        // try. Anything else (an expired link, nothing to find) is final.
        var canRetry = r.status === 409 || r.status >= 500 || !r.json;
        if (!lines.length && canRetry) lines = ['Try again in a minute. It is safe to repeat.'];
        show('Not done', title || "That didn't go through", lines, 'bad');
        if (canRetry) offerRetry();
        else button.hidden = true;
      })
      .catch(function () {
        show('Not done', "We couldn't reach BookNStyle", [
          'Check your connection and try again. It is safe to repeat: nothing is done twice.'
        ], 'bad');
        offerRetry();
      });
  };
})();
</script>
</body>
</html>
