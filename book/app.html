<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Open BookNStyle</title>
<meta name="description" content="Open the BookNStyle app.">
<meta name="robots" content="noindex">
<meta name="apple-itunes-app" content="app-id=6813224710">
<meta name="theme-color" content="#0A0B11">
<meta name="color-scheme" content="dark">
<link rel="icon" href="/img/mark.png">
<!--
  https://app.booknstyle.com/book/app: the "Open BookNStyle" button in our
  emails (OPEN_APP_URL in supabase/functions/_shared/emails.ts).

  With the app installed, iOS Universal Links / Android App Links open this
  address in the app (it's under /book/, which both apps claim) and this page
  is never shown; the app sends it to its home screen (app/+native-intent.tsx).
  "app" is a reserved handle (is_reserved_handle, migration 031), so no pro's
  page can ever be built here.

  This page is for when the link opens in a browser instead: the app isn't
  installed, an email app opened the link in its own browser, or the email
  was opened on a computer. "Open BookNStyle" uses the app's own address
  (booknstyle://), or on Android an intent: link that goes to Google Play
  when the app isn't there. On a computer the button is hidden and the page
  points to the stores.

  Like every page on this site except /pro/, it must not link to the billing
  page (scripts/billing-guard.mjs).

  The look: the website's (booknstyle.com), from /assets/editorial.css, the
  same as the booking page (index.html). Dark only.
-->
<link rel="stylesheet" href="/assets/editorial.css">
<style>
  /* Only what this page has: the Open BookNStyle button, then the stores. */
  .card .btn { margin-top: 28px; }
  .note { color: var(--text-3); font-size: 14px; margin: 28px 0 0; }
  .note:not([hidden]) + .stores { margin-top: 14px; }
</style>
</head>
<body>
  <header class="top">
    <a class="brand" href="/">
      <img src="/img/mark.png" alt="">
      <span>BookNStyle</span>
      <i></i>
    </a>
  </header>

  <main>
    <section class="card center">
      <p class="eyebrow">BookNStyle</p>
      <h1 id="title">Open the <em>app</em></h1>
      <p class="sub" id="sub">Your bookings, schedule and messages are in the BookNStyle app.</p>
      <a class="btn btn--gold" id="open" href="booknstyle://">Open BookNStyle
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>

      <p class="note" id="note">Don't have the app on this phone?</p>
      <div class="stores" id="stores">
        <a class="apple" id="apple" href="https://apps.apple.com/app/id6813224710" rel="noopener">
          <img src="/img/app-store.png" alt="Download on the App Store">
        </a>
        <a class="google" id="google" href="https://play.google.com/store/apps/details?id=com.booknstyle.app" rel="noopener">
          <img src="/img/google-play.png" alt="Get it on Google Play">
        </a>
      </div>
    </section>

    <footer>
      <a href="https://legal.booknstyle.com/terms/">Terms</a> ·
      <a href="https://legal.booknstyle.com/privacy/">Privacy</a> ·
      © BookNStyle LLC
    </footer>
  </main>

<script>
(function () {
  'use strict';
  var ua = navigator.userAgent || '';
  // iPadOS Safari says "Macintosh"; a touch screen tells it apart from a Mac.
  var isIPad = /Macintosh/.test(ua) && navigator.maxTouchPoints > 1;
  var isPhone = /iPhone|iPod|iPad|Android/i.test(ua) || isIPad;
  if (!isPhone) {
    // A computer can't open the phone app: say so, and show the stores.
    document.getElementById('open').hidden = true;
    // "phone app" in the gold italic, like "app" above (built as text).
    var title = document.getElementById('title');
    title.textContent = 'BookNStyle is a ';
    var accent = document.createElement('em');
    accent.textContent = 'phone app';
    title.appendChild(accent);
    document.getElementById('sub').textContent =
      'Open this email on your phone to go straight to the app, or get it here:';
    document.getElementById('note').hidden = true;
    return;
  }
  if (/android/i.test(ua)) {
    // Chrome opens the app from an intent: link, and goes to Google Play
    // when it isn't installed. An empty path opens the app's home screen.
    document.getElementById('open').href =
      'intent://#Intent;scheme=booknstyle;package=com.booknstyle.app;end';
    // Put the store for this phone first.
    var stores = document.getElementById('stores');
    stores.insertBefore(document.getElementById('google'), document.getElementById('apple'));
  }
})();
</script>
</body>
</html>
